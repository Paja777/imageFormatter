[project]
name = "image-resizer"
version = "1.0.0"
description = "Offline image resizer and format converter."
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
packaging = [
    "pyinstaller>=6.11",
]

[project.scripts]
image-resizer = "image_resizer.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_resizer = ["resources/*.json", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
